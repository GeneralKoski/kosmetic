name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets
      - run: cargo test --all-targets
      # kosmetic checks and formats its own manifests.
      - run: cargo run --quiet -p kosmetic-cli -- check Cargo.toml crates/*/Cargo.toml rust-toolchain.toml
      - run: cargo run --quiet -p kosmetic-cli -- fmt --diff Cargo.toml crates/*/Cargo.toml rust-toolchain.toml

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  toml-test:
    name: toml-test suite (TOML 1.0.0)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: toml-test/go.sum
      - uses: Swatinem/rust-cache@v2
      - run: scripts/toml-test.sh -color=never
      # The formatter must keep the values of every valid file of the suite.
      - run: cargo test -p kosmetic-format toml_test_corpus

  vscode:
    name: VS Code extension
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: npx vsce package
