[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Martin Trajkovski"]
repository = "https://github.com/GeneralKoski/kosmetic"

[workspace.dependencies]
kosmetic-diagnostics = { path = "crates/kosmetic-diagnostics" }
kosmetic-syntax = { path = "crates/kosmetic-syntax" }
kosmetic-rules = { path = "crates/kosmetic-rules" }

clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
